<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Questionário</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #questionario {
            padding: 20px;
            max-width: 700px;
        }

        h1 {
            font-size: 28px;
        }

        button {
            padding: 15px 25px;
            margin: 8px;
            font-size: 17px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #video {
            display: none;
            width: 100%;
        }

        video {
            width: 100%;
            max-width: 900px;
            display: block;
        }
    </style>
</head>

<body>

    <div id="questionario">

        <h1>
            Quer continuar sua experiência em português ou deseja trocar a linguagem?
        </h1>

        <button onclick="mostrarVideo()">
            Trocar linguagem
        </button>

        <button onclick="mostrarVideo()">
            Prefiro deixar como está
        </button>

    </div>


    <div id="video">

        <video id="meuVideo" controls playsinline>
            <source src="vdff.mp4" type="video/mp4">

            Seu navegador não conseguiu carregar o vídeo.
        </video>

    </div>


    <script>
        function mostrarVideo() {

            // Esconde o questionário
            document.getElementById("questionario").style.display = "none";

            // Mostra o vídeo
            document.getElementById("video").style.display = "block";

            // Tenta iniciar o vídeo
            const video = document.getElementById("meuVideo");

            video.play().catch(function() {
                // Se o navegador bloquear o autoplay,
                // o usuário pode apertar o botão de reprodução.
            });
        }
    </script>

</body>
</html>

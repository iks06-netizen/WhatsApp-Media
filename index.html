
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Questionário</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #video {
            display: none;
            width: 100%;
        }

        video {
            width: 100%;
            max-width: 900px;
        }

        button {
            padding: 15px 30px;
            margin: 8px;
            font-size: 18px;
            border: 0;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div id="questionario">
        <h1>Questionário</h1>
        <p>Você gosta de jogos?</p>

        <button onclick="mostrarVideo()">Sim</button>
        <button onclick="mostrarVideo()">Não</button>
    </div>

    <div id="video">
        <video id="meuVideo" controls>
            <source src="vdff.mp4" type="vdff/mp4">
        </video>
    </div>

    <script>
        function mostrarVideo() {
            document.getElementById("questionario").style.display = "none";
            document.getElementById("video").style.display = "block";

            document.getElementById("meuVideo").play();
        }
    </script>

</body>
</html>
